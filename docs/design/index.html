<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Payat Book</title>
<meta name="theme-color" content="#FAF7F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Payat Book">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --cotton:#FAF7F0;
  --paper:#FFFFFF;
  --ink:#20291F;
  --ink-soft:#5C6657;
  --green:#0E5A3C;
  --green-deep:#0A3F2A;
  --green-tint:#E7F0EA;
  --gold:#C9A227;
  --gold-soft:#EFE3BC;
  --red:#A63A2B;
  --red-tint:#F6E7E2;
  --line:#E7E1D2;
  --radius:16px;
  --shadow:0 1px 3px rgba(32,41,31,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Baloo Chettan 2","Segoe UI",system-ui,sans-serif;
  background:var(--cotton);color:var(--ink);
  font-size:17px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- header with kasavu border ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:center;gap:8px;min-height:56px;
}
header::after{ /* kasavu: double gold stripe */
  content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;
  background:
    linear-gradient(var(--gold),var(--gold)) 0 0/100% 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) 0 6px/100% 1px no-repeat;
}
header h1{font-size:20px;font-weight:700;letter-spacing:.2px;flex:1;color:var(--green-deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .logo{height:38px;flex:1;object-fit:contain;object-position:left}
.hbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--green-deep);flex:none}
.hbtn:active{background:var(--cotton)}
.back{margin-left:-8px}

main{padding:22px 16px 96px;max-width:560px;margin:0 auto}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;border-radius:12px;color:var(--ink-soft);
  font-size:12.5px;font-weight:600;
}
nav button.on{color:var(--green)}
nav svg{width:26px;height:26px}

/* ---------- home ledger spread ---------- */
.spread{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;overflow:hidden;position:relative;
}
.spread::before{
  content:"";position:absolute;left:50%;top:10px;bottom:10px;width:0;
  border-left:3px solid var(--gold);border-right:1px solid var(--gold);
  transform:translateX(-2px);opacity:.85;
}
.page{flex:1;padding:18px 12px;text-align:center}
.page .lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.page .amt{font-size:29px;font-weight:700;margin-top:2px}
.page.receive .amt{color:var(--green)}
.page.give .amt{color:var(--red)}
.page .sub{font-size:13px;color:var(--ink-soft)}

.banner{
  margin-top:14px;background:var(--gold-soft);border:1px solid var(--gold);
  border-radius:12px;padding:10px 14px;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.banner button{font-weight:700;color:var(--green-deep);text-decoration:underline}

h2.sec{font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:26px 2px 10px}

/* ---------- cards & lists ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row:active{background:var(--cotton)}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:var(--green-tint);color:var(--green-deep);
  display:grid;place-items:center;font-weight:700;font-size:18px;
}
.row .body{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-weight:700;font-size:15px;padding:4px 10px;border-radius:999px;flex:none}
.chip.pos{background:var(--green-tint);color:var(--green-deep)}
.chip.neg{background:var(--red-tint);color:var(--red)}
.chip.zero{background:var(--cotton);color:var(--ink-soft);border:1px solid var(--line)}
.chip.gold{background:var(--gold-soft);color:var(--green-deep);border:1px solid var(--gold)}

.empty{padding:32px 20px;text-align:center;color:var(--ink-soft);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--green);color:#fff;font-weight:700;font-size:16.5px;
  padding:14px 10px;border-radius:14px;margin-top:14px;
}
.btn:active{background:var(--green-deep)}
.btn.ghost{background:var(--paper);color:var(--green-deep);border:1.5px solid var(--green)}
.btn.gold{background:var(--paper);color:var(--green-deep);border:1.5px solid var(--gold)}
.btn.wa{background:#1FAF5A}
.btn.danger{background:var(--paper);color:var(--red);border:1.5px solid var(--red)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{margin-top:14px}
.btn svg{width:22px;height:22px;flex:none}

/* ---------- person / event hero card ---------- */
.balcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
.balcard .who{font-size:20px;font-weight:700}
.balcard .phone{font-size:14px;color:var(--ink-soft)}
.balcard .big{font-size:35px;font-weight:700;margin-top:6px}
.balcard .big.pos{color:var(--green)}
.balcard .big.neg{color:var(--red)}
.balcard .state{font-size:14.5px;color:var(--ink-soft)}
.statusrow{display:flex;justify-content:center;gap:8px;margin-top:6px}

.tl .row .meta{margin-top:1px}
.amt-in{color:var(--red);font-weight:700}
.amt-out{color:var(--green);font-weight:700}
.mini{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink-soft);flex:none}
.mini:active{background:var(--cotton)}
.mini svg{width:20px;height:20px}
.addmini{
  flex:none;background:var(--green);color:#fff;font-weight:700;font-size:14px;
  padding:8px 14px;border-radius:999px;
}
.addmini:active{background:var(--green-deep)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,30,22,.45);z-index:30;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);
  transition:transform .22s ease;background:var(--paper);
  border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;
}
.sheet.open{transform:none}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--cotton);font-size:17px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--green)}
.hint{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
.seg{display:flex;background:var(--cotton);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:15px;color:var(--ink-soft)}
.seg button.on{background:var(--green);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{
  border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--green-deep);
  font-weight:700;padding:8px 13px;border-radius:999px;font-size:14.5px;
}
.searchwrap{padding:0 0 10px}
.searchwrap input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--cotton);font-size:16px;
}
.picklist{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;
  opacity:0;transition:all .25s ease;z-index:40;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

const t = k => (STR[LANG] && STR[LANG][k]) || STR.en[k] || k;

/* ================= tiny IndexedDB layer ================= */
let db, people=[], events=[], txns=[], meta={};
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("payatbook", 1);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      d.createObjectStore("people", {keyPath:"id", autoIncrement:true});
      d.createObjectStore("events", {keyPath:"id", autoIncrement:true});
      const tt = d.createObjectStore("txns", {keyPath:"id", autoIncrement:true});
      tt.createIndex("personId","personId"); tt.createIndex("eventId","eventId");
      d.createObjectStore("meta", {keyPath:"k"});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function store(n,mode){ return db.transaction(n,mode||"readonly").objectStore(n); }
function req(q){ return new Promise((res,rej)=>{ q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function refresh(){
  people = await req(store("people").getAll());
  events = await req(store("events").getAll());
  txns   = await req(store("txns").getAll());
  const m = await req(store("meta").getAll());
  meta = {}; m.forEach(x=>meta[x.k]=x.v);
}
async function save(n,val){ const id = await req(store(n,"readwrite").put(val)); await refresh(); return id; }
async function remove(n,id){ await req(store(n,"readwrite").delete(id)); await refresh(); }
async function setMeta(k,v){ await req(store("meta","readwrite").put({k,v})); meta[k]=v; }

const fmt = n=>"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN");
const today = ()=>new Date().toISOString().slice(0,10);
const dstr = iso=>{ if(!iso) return ""; const d=new Date(iso+"T00:00");
  return d.toLocaleDateString(LANG==="ml"?"ml-IN":"en-IN",{day:"numeric",month:"short",year:"numeric"}); };
const person = id=>people.find(p=>p.id===id);
const initials = n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join("");
/* balance: out = I gave them (they owe me, +).  in = they gave me (I owe them, −) */
const bal = pid=>txns.filter(x=>x.personId===pid).reduce((s,x)=>s+(x.dir==="out"?x.amount:-x.amount),0);
const eventTotal = eid=>txns.filter(x=>x.eventId===eid).reduce((s,x)=>s+x.amount,0);
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._x); el._x=setTimeout(()=>el.classList.remove("show"),2200); }

  return `<span class="chip zero">${t("settled")}</span>`;
}

/* ================= navigation ================= */
let stack = [{v:"home"}];
function go(v, p){ stack.push({v, p}); history.pushState(null,""); render(); }
function back(){ if(stack.length>1){ stack.pop(); } render(); }
function setTab(v){ stack = [{v}]; render(); }
window.addEventListener("popstate", ()=>{ closeSheet(); if(stack.length>1){ stack.pop(); render(); } });

function header(title, opts){
  opts = opts||{};
  $("#hdr").innerHTML =
    (opts.back?`<button class="hbtn back" onclick="back()" aria-label="Back">${ICON.back}</button>`:"") +
    (opts.logo?`<img src="logo-h.png" class="logo" alt="Payat Book">`:`<h1>${esc(title)}</h1>`) +
    (opts.gear?`<button class="hbtn" onclick="openSettings()" aria-label="Settings">${ICON.gear}</button>`:"") +
    (opts.actions||"");
}
function nav(active){
  const tb = (v,icon,label)=>`<button class="${active===v?'on':''}" onclick="setTab('${v}')">${icon}<span>${esc(label)}</span></button>`;
  $("#nav").innerHTML = tb("home",ICON.home,t("tabBook")) + tb("people",ICON.people,t("tabPeople")) + tb("events",ICON.env,t("tabPayatts"));
}
function render(){
  const cur = stack[stack.length-1];
  ({home:renderHome, people:renderPeople, person:renderPerson, events:renderEvents, event:renderEvent}[cur.v])(cur.p);
  window.scrollTo(0,0);
}

/* ================= HOME ================= */
function renderHome(){
  header("",{logo:true, gear:true}); nav("home");
  let recv=0, give=0, cr=0, cg=0;
  people.forEach(p=>{ const b=bal(p.id); if(b>0){recv+=b;cr++;} if(b<0){give-=b;cg++;} });
  const needBackup = txns.length>0 && (!meta.lastBackup || (Date.now()-meta.lastBackup) > 7*864e5);
  const recent = [...txns].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id-a.id).slice(0,8);
  $("#main").innerHTML = `
    <div class="spread">
      <div class="page receive">
        <div class="lbl">${t("toReceive")}</div>
        <div class="amt num">${fmt(recv)}</div>
        <div class="sub num">${cr} ${cr===1?t("ppl1"):t("ppl")}</div>
      </div>
      <div class="page give">
        <div class="lbl">${t("toGive")}</div>
        <div class="amt num">${fmt(give)}</div>
        <div class="sub num">${cg} ${cg===1?t("ppl1"):t("ppl")}</div>
      </div>
    </div>
    ${needBackup?`<div class="banner">📒 ${t("keepSafe")} <button onclick="doExport()">${t("backupNow")}</button></div>`:""}
    <h2 class="sec">${t("recent")}</h2>
    <div class="card tl">
      ${recent.length? recent.map(txRow).join("") :
        `<div class="empty"><b>${t("emptyBookT")}</b>${t("emptyBookD")}</div>`}
    </div>
    ${txns.length===0?`<button class="btn" onclick="setTab('people')">${ICON.plus} ${t("addFirst")}</button>`:""}
  `;
  killFab();
}
function txRow(x){
  const p = person(x.personId); if(!p) return "";
  const ev = events.find(e=>e.id===x.eventId);
  const line = x.dir==="in"
    ? `<span class="amt-in num">${tp("recentIn",{n:esc(p.name),a:fmt(x.amount)})}</span>`
    : `<span class="amt-out num">${tp("recentOut",{n:esc(p.name),a:fmt(x.amount)})}</span>`;
  return `<button class="row" onclick="go('person',${p.id})">
    <div class="avatar">${esc(initials(p.name))}</div>
    <div class="body">
      <div class="name">${line}</div>
      <div class="meta">${esc(dstr(x.date))}${ev?` · ${esc(ev.title)}`:""}${x.note?` · ${esc(x.note)}`:""}</div>
    </div>
  </button>`;
}

        return `<div class="row">
          <div class="avatar">${esc(initials(p.name))}</div>
          <div class="body"><div class="name">${esc(p.name)}</div>
          <div class="meta">${esc(dstr(x.date))}${x.note?` · ${esc(x.note)}`:""}</div></div>
          <span class="num" style="font-weight:700">${fmt(x.amount)}</span>
          <button class="mini" onclick="delTxn(${x.id})" aria-label="Delete">${ICON.trash}</button>
        </div>`;}).join("") :
        `<div class="empty"><b>${t("emptyEvT")}</b>${tp("emptyEvD",{b:addLabel})}</div>`}
    </div>`;
  killFab();
}
async function toggleStatus(eid){
  const e = events.find(x=>x.id===eid); if(!e) return;
  const closing = e.status!=="closed";
  await save("events", {...e, status: closing?"closed":"open"});
  render(); toast(closing?t("tFinished"):t("tReopened"));
}
async function delEvent(id){
  if(!confirm(t("qDelPayat"))) return;
  for(const x of txns.filter(x=>x.eventId===id)) await req(store("txns","readwrite").delete(x.id));
  await remove("events", id); setTab("events"); toast(t("tDeleted"));
}

/* ================= SHEETS / FORMS ================= */
function openSheet(html){ $("#sheet").innerHTML=html; $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").addEventListener("click", closeSheet);

/* --- add / edit person --- */
function personForm(id){
  const p = id?person(id):null;
  openSheet(`
    <h3>${p?t("editPerson"):t("addPerson")}</h3>
    <div class="field"><label>${t("fName")}</label><input id="f-name" value="${p?esc(p.name):""}" autocomplete="off"></div>
    <div class="field"><label>${t("fPhone")}</label>
      <input id="f-phone" inputmode="tel" placeholder="+91 98765 43210" value="${p?esc(p.phone||""):""}">
      <div class="hint">${t("phoneHint")}</div></div>
    <button class="btn" onclick="savePerson(${p?p.id:"null"})">${p?t("saveChanges"):t("addPerson")}</button>
    ${p?`<button class="btn danger" onclick="delPerson(${p.id})">${t("delPerson")}</button>`:""}
  `);
  setTimeout(()=>$("#f-name").focus(),250);
}
async function savePerson(id){
  const name = $("#f-name").value.trim();
  if(!name){ toast(t("tEnterName")); return; }
  const phone = $("#f-phone").value.trim();
  const rec = id?{...person(id),name,phone}:{name,phone,created:today()};
  const newId = await save("people", rec);
  closeSheet();
  if(!id && sheetAfterAdd){ const fn=sheetAfterAdd; sheetAfterAdd=null; fn(newId); return; }
  render(); toast(id?t("tSaved"):t("tPersonAdded"));
}
async function delPerson(id){
  if(!confirm(t("qDelPerson"))) return;
  for(const x of txns.filter(x=>x.personId===id)) await req(store("txns","readwrite").delete(x.id));
  await remove("people", id); closeSheet(); setTab("people"); toast(t("tDeleted"));
}

/* --- add entry --- */
let entryCtx=null;
function entryForm(ctx){
  closeSheet();
  entryCtx = {date:today(), ...ctx};
  const p = person(ctx.personId);
  const b = bal(ctx.personId);
  let chips="";
  const owed = ctx.dir==="in" ? (b>0?b:0) : (b<0?-b:0);
  if(owed>0){
    chips = `<div class="chips">
      <button onclick="$('#f-amt').value=${owed};">${fmt(owed)} · ${t("closeBal")}</button>
      <button onclick="$('#f-amt').value=${owed*2};">${fmt(owed*2)} · ${t("double")}</button>
    </div>
    <div class="hint">${ctx.dir==="in"?tp("hintOwesYou",{n:esc(p.name),a:fmt(owed)}):tp("hintYouOwe",{n:esc(p.name),a:fmt(owed)})} ${t("hintDouble")}</div>`;
  }
  openSheet(`
    <h3>${ctx.dir==="in"?`${esc(p.name)} — ${t("theyGave")}`:`${t("iGave")} — ${esc(p.name)}`}</h3>
    <div class="field"><label>${t("fAmount")}</label>
      <input id="f-amt" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">${chips}</div>
    <div class="field"><label>${t("fDate")}</label><input id="f-date" type="date" value="${entryCtx.date}"></div>
    <div class="field"><label>${t("fNote")}</label><input id="f-note" placeholder="${t("notePH")}" autocomplete="off"></div>
    <button class="btn" onclick="saveEntry()">${t("saveEntry")}</button>
  `);
  setTimeout(()=>$("#f-amt").focus(),250);
}
async function saveEntry(){
  const amount = parseInt(($("#f-amt").value||"").replace(/[^\d]/g,""),10);
  if(!amount){ toast(t("tEnterAmount")); return; }
  await save("txns", {
    personId: entryCtx.personId, dir: entryCtx.dir, amount,
    date: $("#f-date").value||today(), note: $("#f-note").value.trim(),
    eventId: entryCtx.eventId||null
  });
  closeSheet(); render(); toast(t("tEntry"));
}

/* --- person pickers --- */
let sheetAfterAdd=null;
function personPicker(title, onPick){
  const listHtml = q=>people
    .filter(p=>p.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map(p=>`<button class="row" onclick="(${onPick})(${p.id})">
      <div class="avatar">${esc(initials(p.name))}</div>
      <div class="body"><div class="name">${esc(p.name)}</div></div>${balChip(bal(p.id))}
    </button>`).join("") || `<div class="empty">${t("noMatch")}</div>`;
  openSheet(`
    <h3>${title}</h3>
    <div class="searchwrap"><input id="pick-q" placeholder="${t("searchName")}" autocomplete="off"
      oninput="$('#pick-list').innerHTML=this._f(this.value)"></div>
    <div class="picklist" id="pick-list">${listHtml("")}</div>
    <button class="btn ghost" id="pick-new">${ICON.plus} ${t("newPerson")}</button>
  `);
  $("#pick-q")._f = listHtml;
  setTimeout(()=>$("#pick-q").focus(),250);

function pickPersonThen(eventId){
  personPicker(t("whoGave"), `id=>entryForm({personId:id,dir:'in',eventId:${eventId}})`);
  $("#pick-new").onclick = ()=>{ sheetAfterAdd = id=>entryForm({personId:id,dir:"in",eventId}); personForm(); };
}
function payPick(){
  personPicker(t("whoPay"), `id=>entryForm({personId:id,dir:'out'})`);
  $("#pick-new").onclick = ()=>{ sheetAfterAdd = id=>entryForm({personId:id,dir:"out"}); personForm(); };
}

/* --- host a payat --- */
function hostForm(){
  openSheet(`

    <div class="field"><label>${t("fPayatName")}</label><input id="f-title" placeholder="${t("payatNamePH")}" autocomplete="off"></div>

/* ================= WHATSAPP SHARE ================= */
function shareBalance(pid){
  const p = person(pid); const b = bal(pid);
  const hist = txns.filter(x=>x.personId===pid)
    .sort((a,b2)=>(a.date||"").localeCompare(b2.date||"")||a.id-b2.id)
    .map(x=>`${dstr(x.date)} — ${x.dir==="in"?t("shareYouGave"):t("shareIGave")} ${fmt(x.amount)}${x.note?" ("+x.note+")":""}`);
  const balLine = b>0?`*${tp("shareBalGive",{a:fmt(b)})}*`: b<0?`*${tp("shareBalMine",{a:fmt(b)})}*`:`*${t("shareBalZero")}*`;
  const text = `📒 *${tp("shareTitle",{n:p.name})}*\n\n${hist.join("\n")}\n\n${balLine}`;
  const phone = (p.phone||"").replace(/[^\d]/g,"");
  const url = phone
    ? `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
  window.open(url,"_blank");
}

/* ================= SETTINGS / BACKUP ================= */
function openSettings(){
  openSheet(`
    <h3>${t("settingsT")}</h3>
    <div class="field"><label>${t("language")}</label>
      <div class="seg">
        <button class="${LANG==="en"?"on":""}" onclick="setLang('en')">English</button>
        <button class="${LANG==="ml"?"on":""}" onclick="setLang('ml')">മലയാളം</button>
      </div></div>
    <p class="hint" style="margin-bottom:6px">${t("backupHint")}</p>
    <button class="btn" onclick="doExport()">${t("saveBackup")}</button>
    <button class="btn ghost" onclick="$('#f-import').click()">${t("restore")}</button>
    <input id="f-import" type="file" accept=".json,application/json" style="display:none" onchange="doImport(this.files[0])">
    <p class="hint" style="margin-top:14px">${meta.lastBackup?tp("lastBackup",{d:new Date(meta.lastBackup).toLocaleDateString("en-IN")}):t("noBackup")}</p>
  `);
}
async function setLang(l){
  LANG = l; await setMeta("lang", l);
  document.documentElement.lang = l;
  openSettings(); render();
}
async function doExport(){
  const data = JSON.stringify({app:"payat-book",version:2,exported:new Date().toISOString(),people,events,txns},null,1);
  const fname = `payat-backup-${today()}.json`;
  const blob = new Blob([data],{type:"application/json"});
  const file = new File([blob], fname, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Payat Book backup"});
    } else {
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
    await setMeta("lastBackup", Date.now());
    closeSheet(); render(); toast(t("tBackupSaved"));
  }catch(e){ /* user cancelled share */ }
}
function doImport(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = JSON.parse(r.result);
      if(d.app!=="payat-book" || !Array.isArray(d.people)) throw 0;
      if(!confirm(tp("qRestore",{p:d.people.length,t:d.txns.length}))) return;
      for(const s of ["people","events","txns"]) await req(store(s,"readwrite").clear());
      for(const p of d.people) await req(store("people","readwrite").put(p));
      for(const e of d.events) await req(store("events","readwrite").put(e));
      for(const x of d.txns)   await req(store("txns","readwrite").put(x));
      await refresh(); closeSheet(); setTab("home"); toast(t("tRestored"));
    }catch(e){ toast(t("tBadFile")); }
  };
  r.readAsText(file);
}

/* ================= boot ================= */
(async function(){
  try{
    db = await openDB();
    await refresh();
    LANG = meta.lang || "en";
    document.documentElement.lang = LANG;
    render();
  }catch(e){
    document.body.innerHTML = `<div style="padding:40px 24px;text-align:center;font-family:system-ui">
      <h2>${t("storageT")}</h2><p>${t("storageD")}</p></div>`;
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
